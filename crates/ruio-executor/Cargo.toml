[package]
name = "ruio-executor"
description = "The thread-per-core executor of ruio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Stream` and `FusedStream` of futures-core for the channels' receivers and
# for intervals, so that they compose with futures-util's combinators.
futures = ["dep:futures-core"]

[dependencies]
futures-core = { workspace = true, optional = true }
libc.workspace = true
ruio-driver.workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }

[lints]
workspace = true
