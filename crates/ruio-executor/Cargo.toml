[package]
name = "ruio-executor"
description = "The thread-per-core executor of ruio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Stream` and `FusedStream` of futures-core for the channels' receivers and
# for intervals, so that they compose with futures-util's combinators.
futures = ["dep:futures-core"]

[dependencies]
futures-core = { workspace = true, optional = true }
ruio-engine.workspace = true

# The io_uring engine, which the executor runs on on Linux unless it is
# built with `--cfg ruio_engine="park"`. build.rs tells the code the same,
# as `cfg(ruio_uring)`.
[target.'cfg(all(target_os = "linux", not(ruio_engine = "park")))'.dependencies]
ruio-driver.workspace = true

# The I/O completion port engine, which the executor runs on on Windows
# unless it is built with `--cfg ruio_engine="park"`. build.rs tells the
# code the same, as `cfg(ruio_iocp)`.
[target.'cfg(all(windows, not(ruio_engine = "park")))'.dependencies]
ruio-iocp.workspace = true

# For pinning threads to CPUs, which ruio does on Linux alone so far.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false }

[lints]
workspace = true
