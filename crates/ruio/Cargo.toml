[package]
name = "ruio"
description = "A thread-per-core async runtime built on io_uring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Stream` and `FusedStream` of futures-core for the streams of connections,
# data, directory entries, readiness and signals, and those of the executor
# and the driver beneath, so that they compose with futures-util's
# combinators.
futures = ["dep:futures-core", "ruio-driver/futures", "ruio-executor/futures"]

[dependencies]
futures-core = { workspace = true, optional = true }
libc.workspace = true
ruio-driver.workspace = true
ruio-executor.workspace = true
ruio-macros.workspace = true
ruio-sys.workspace = true

[dev-dependencies]
# For the tests and examples of portable I/O polled where no runtime runs:
# `futures::executor::block_on` on a plain thread, and tokio's own
# multi-threaded runtime.
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "time"] }

[lints]
workspace = true
