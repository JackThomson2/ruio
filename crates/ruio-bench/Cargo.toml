[package]
name = "ruio-bench"
description = "Benchmarks of ruio against other runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The only crate that depends on another runtime: it is what ruio is
# measured against.
[dependencies]
# For `StreamExt`, over ruio's streams and tokio-stream's wrappers.
futures-util = { version = "0.3.34", default-features = false }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2", "server"] }
# The legacy client, on both runtimes, and tokio's executor, timer and
# connector for it.
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
libc.workspace = true
ruio = { workspace = true, features = ["futures"] }
ruio-compat = { workspace = true, features = ["client", "tokio", "tokio-reactor"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "process", "rt", "rt-multi-thread", "signal", "sync"] }
# For `UnboundedReceiverStream`, which gives tokio's channels the `Stream`
# ruio's have.
tokio-stream = { version = "0.1.17", default-features = false }
# For `CancellationToken`, which ruio's is measured against.
tokio-util = { version = "0.7.19", default-features = false }

[lints]
workspace = true
