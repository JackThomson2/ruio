[package]
name = "ruio-bench"
description = "Benchmarks of ruio against other runtimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The only crate that depends on another runtime: it is what ruio is
# measured against.
[dependencies]
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
libc.workspace = true
ruio.workspace = true
ruio-compat = { workspace = true, features = ["tokio"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "net", "rt", "rt-multi-thread", "signal", "sync"] }
# For `CancellationToken`, which ruio's is measured against.
tokio-util = { version = "0.7.19", default-features = false }

[lints]
workspace = true
