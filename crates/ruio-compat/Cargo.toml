[package]
name = "ruio-compat"
description = "Adapters from ruio's streams to the futures-io and tokio::io traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["futures-io", "hyper", "tokio"]
# `AsyncRead`, `AsyncBufRead` and `AsyncWrite` of futures-io.
futures-io = ["dep:futures-io"]
# `Timer`, which gives hyper ruio's timers for its timeouts. It needs none of
# hyper's own features.
hyper = ["dep:hyper"]
# `AsyncRead`, `AsyncBufRead` and `AsyncWrite` of `tokio::io`, which need
# none of tokio's runtime.
tokio = ["dep:tokio"]

[dependencies]
futures-io = { version = "0.3.34", optional = true }
hyper = { version = "1.11.1", default-features = false, optional = true }
libc.workspace = true
ruio.workspace = true
tokio = { version = "1.53.1", default-features = false, optional = true }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["io"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "server"] }
# For `TokioIo`, which gives hyper's traits to types with tokio's.
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = "0.14.10"
# ring for cryptography, which builds with a C compiler alone.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tokio = { version = "1.53.1", features = ["io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }

[[example]]
name = "hyper"
required-features = ["hyper", "tokio"]

[[example]]
name = "rustls"
required-features = ["hyper", "tokio"]

[lints]
workspace = true
