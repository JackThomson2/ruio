[package]
name = "ruio-compat"
description = "Adapters from ruio's streams to the futures-io and tokio::io traits"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["futures-io", "hyper", "tokio"]
# `client::Connector`, which makes the connections of hyper-util's client
# with ruio's portable TCP streams, and `client::builder`, which gives the
# client ruio's executor and timer. The client speaks HTTP/1.1; hyper-util's
# `http2` feature adds HTTP/2.
client = [
    "hyper",
    "dep:hyper-util",
    "hyper-util/client-legacy",
    "hyper-util/http1",
    "dep:tower-service",
]
# `AsyncRead`, `AsyncBufRead` and `AsyncWrite` of futures-io.
futures-io = ["dep:futures-io"]
# `Executor`, which spawns the tasks hyper's HTTP/2 needs, `Timer`, which
# gives hyper ruio's timers for its timeouts, and hyper's own I/O traits for
# the adapters. It needs none of hyper's own features.
hyper = ["dep:hyper"]
# `AsyncRead`, `AsyncBufRead` and `AsyncWrite` of `tokio::io`, which need
# none of tokio's runtime.
tokio = ["dep:tokio"]

[dependencies]
futures-io = { version = "0.3.34", optional = true }
hyper = { version = "1.11.1", default-features = false, optional = true }
hyper-util = { version = "0.1.21", default-features = false, optional = true }
libc.workspace = true
ruio.workspace = true
tokio = { version = "1.53.1", default-features = false, optional = true }
tower-service = { version = "0.3.3", optional = true }

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["io"] }
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2", "server"] }
# For `TokioIo`, which gives hyper's traits to types with tokio's, and
# HTTP/2 for the client's tests.
hyper-util = { version = "0.1.21", features = ["http2", "tokio"] }
rcgen = "0.14.10"
# ring for cryptography, which builds with a C compiler alone.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
# The multi-threaded runtime for the portable file's tests, which run its
# I/O from tokio's workers.
tokio = { version = "1.53.1", features = ["io-util", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
# For the client's tests, whose TLS connector wraps the plain one.
tower-service = "0.3.3"

[[example]]
name = "hyper"
required-features = ["hyper", "tokio"]

[[example]]
name = "rustls"
required-features = ["hyper", "tokio"]

[[example]]
name = "http2"
required-features = ["hyper"]

[lints]
workspace = true
