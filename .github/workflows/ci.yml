name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail instead of skipping if the ABI test finds no C compiler or header.
  RUIO_REQUIRE_ABI_CHECK: "1"
  # Fail instead of skipping if a target the executor is built for is not
  # installed.
  RUIO_REQUIRE_CROSS_CHECK: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install the targets the executor is built for besides Linux
        run: rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Show the kernel
        run: uname -a
      - name: Report io_uring capabilities
        run: cargo run --locked -p ruio-driver --example probe
      # What a job prints goes to a file too, from which a last step says
      # what failed, and how fast the engine is, in annotations of the run.
      - name: Check
        shell: bash
        run: ci/check.sh 2>&1 | tee check.log
      - name: Time the io_uring engine
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo run --release --locked -p ruio --example speed 2>>check.log | tee speed.txt
          ci/annotate.sh notice "Speed on io_uring" speed.txt
      # On this machine, as two runs of CI land on machines whose speeds
      # differ by half.
      - name: Time it against what the push replaced
        if: ${{ !cancelled() && github.event_name == 'push' && !startsWith(github.event.before, '0000000') }}
        shell: bash
        run: |
          ci/compare.sh "${{ github.event.before }}" 2>>check.log | tee compared.txt
          ci/annotate.sh notice "io_uring before and after the push" compared.txt
      - name: Say what failed
        if: failure() || cancelled()
        shell: bash
        run: ci/annotate.sh failures "What failed on Linux" check.log

  asan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nightly with the standard library sources
        run: rustup toolchain install nightly --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Test under AddressSanitizer
        shell: bash
        run: ci/asan.sh 2>&1 | tee asan.log
      - name: Say what failed
        if: failure() || cancelled()
        shell: bash
        run: ci/annotate.sh failures "What failed under AddressSanitizer" asan.log

  windows:
    runs-on: windows-latest
    # A hung engine would otherwise hold the runner for six hours.
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: "1"
      # Fail instead of skipping the tests of the engine's fine timer and of
      # operations that skip the port, both of which a runner's Windows
      # gives it.
      RUIO_REQUIRE_PORT_SHORTCUTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # As on Linux, what the steps print goes to a file too, for the last
      # step to say what failed.
      # The other crates are Linux's, and do not build on Windows.
      - name: Lint the crates that build on Windows
        shell: bash
        run: cargo clippy -p ruio-engine -p ruio-iocp -p ruio-executor -p ruio --all-targets --all-features --locked -- -D warnings 2>&1 | tee windows.log
      # ruio-compat's examples receive into pools of buffers, which are
      # io_uring's, so its library and its tests are what builds here.
      - name: Lint the adapters of ruio-compat
        shell: bash
        run: cargo clippy -p ruio-compat --lib --tests --all-features --locked -- -D warnings 2>&1 | tee -a windows.log
      # Every test binary runs, so that one run reports every failure.
      - name: Test them on the I/O completion port engine
        shell: bash
        run: cargo test -p ruio-engine -p ruio-iocp -p ruio-executor -p ruio --all-features --locked --no-fail-fast 2>&1 | tee -a windows.log
      - name: Test the adapters on the I/O completion port engine
        shell: bash
        run: cargo test -p ruio-compat --lib --tests --all-features --locked --no-fail-fast 2>&1 | tee -a windows.log
      - name: Test the examples in the adapters' documentation
        shell: bash
        run: cargo test -p ruio-compat --doc --all-features --locked 2>&1 | tee -a windows.log
      # In release, as its figures are for telling one build of the engine
      # from another.
      - name: Time the I/O completion port engine
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo run --release --locked -p ruio --example speed 2>>windows.log | tee speed.txt
          bash ci/annotate.sh notice "Speed on the I/O completion port" speed.txt
      - name: Time it against what the push replaced
        if: ${{ !cancelled() && github.event_name == 'push' && !startsWith(github.event.before, '0000000') }}
        shell: bash
        run: |
          bash ci/compare.sh "${{ github.event.before }}" 2>>windows.log | tee compared.txt
          bash ci/annotate.sh notice "The I/O completion port before and after the push" compared.txt
      - name: Say what failed
        if: failure() || cancelled()
        shell: bash
        run: bash ci/annotate.sh failures "What failed on Windows" windows.log
