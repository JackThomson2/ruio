name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail instead of skipping if the ABI test finds no C compiler or header.
  RUIO_REQUIRE_ABI_CHECK: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Show the kernel
        run: uname -a
      - name: Report io_uring capabilities
        run: cargo run --locked -p ruio-driver --example probe
      - name: Check
        run: ci/check.sh
